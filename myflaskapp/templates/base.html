<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index') }}">My Recipes</a>
    <nav>
      <a class="button secondary" href="{{ url_for('discover') }}">🔍 Discover</a>
      <a class="button secondary" href="{{ url_for('spin') }}">🎡 Spin</a>
      <a class="button" href="{{ url_for('add_recipe') }}">+ Add recipe</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
